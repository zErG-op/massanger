<script src="/socket.io/socket.io.js"></script>
<script>

    const socket = io("http://localhost:3000");

    socket.on("connection", () => {
        console.log("CONNECTED:", socket.id);
    });

    socket.on("connect_error", (err) => {
        console.log("ERROR:", err.message);
    });
</script>
